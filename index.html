<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись на занятие</title>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --bg-secondary: var(--tg-theme-secondary-bg-color, #f1f1f1);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #777777);
            --btn: var(--tg-theme-button-color, #248bca);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --link: var(--tg-theme-link-color, #248bca);
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .subtitle {
            color: var(--hint);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }

        /* ── Кнопка "Мои записи" ── */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }
        .btn-my {
            background: var(--bg-secondary);
            color: var(--text);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-my:active {
            transform: scale(0.97);
        }

        /* ── Календарь ── */
        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .cal-header .month {
            font-weight: 600;
            font-size: 16px;
            text-transform: capitalize;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: var(--link);
            font-size: 22px;
            padding: 4px 12px;
            cursor: pointer;
            font-family: inherit;
            line-height: 1;
        }
        .nav-btn:disabled {
            color: var(--hint);
            opacity: 0.4;
            cursor: default;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            background: transparent;
            color: var(--text);
            border: none;
            font-family: inherit;
            transition: background 0.12s ease;
        }
        .cal-cell.head {
            color: var(--hint);
            font-size: 12px;
            font-weight: 600;
            cursor: default;
            aspect-ratio: auto;
            padding: 4px 0;
        }
        .cal-cell.empty {
            cursor: default;
        }
        .cal-cell.disabled {
            color: var(--hint);
            opacity: 0.35;
            cursor: default;
        }
        .cal-cell.available {
            background: var(--bg);
        }
        .cal-cell.today {
            font-weight: 700;
            color: var(--link);
        }
        .cal-cell.selected {
            background: var(--btn) !important;
            color: var(--btn-text) !important;
            font-weight: 700;
        }

        /* ── Слоты ── */
        .slots-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .slot-btn {
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            padding: 12px 4px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s ease, opacity 0.15s ease;
        }
        .slot-btn:active {
            transform: scale(0.96);
        }
        .slot-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .empty {
            color: var(--hint);
            font-style: italic;
            padding: 12px;
        }

        .error {
            color: var(--danger);
            padding: 10px;
            font-size: 14px;
        }

        /* ── Модалка ── */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .modal {
            background: var(--bg);
            color: var(--text);
            border-radius: 16px;
            padding: 18px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal h3 {
            margin: 0 0 12px;
            font-size: 17px;
        }
        .modal-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-item .info {
            flex: 1;
            min-width: 0;
        }
        .modal-item .info .when {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .modal-item .info .svc {
            font-size: 12px;
            color: var(--hint);
        }
        .modal-item .cancel-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }
        .modal-item .cancel-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .modal-close {
            width: 100%;
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 8px;
        }
        .modal-empty {
            text-align: center;
            color: var(--hint);
            font-style: italic;
            padding: 16px;
        }

        /* ── Статус ── */
        .status {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--btn);
            color: var(--btn-text);
            font-size: 14px;
            transform: translateY(120%);
            transition: transform 0.25s ease;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .status.show { transform: translateY(0); }
        .status.error { background: var(--danger); }

        /* ── Сплэш ── */
        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            color: var(--hint);
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--btn);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app">
    <div class="loader"><div class="spinner"></div>Загрузка…</div>
</div>
<div id="modal-root"></div>
<div id="status" class="status"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   КОНФИГ
   ═══════════════════════════════════════════════════════════ */
const API_BASE = "https://either-goldmine-implosive.ngrok-free.dev";

/* ═══════════════════════════════════════════════════════════
   Telegram WebApp
   ═══════════════════════════════════════════════════════════ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

/* ═══════════════════════════════════════════════════════════
   Состояние
   ═══════════════════════════════════════════════════════════ */
const state = {
    userId: null,
    config: null,
    viewMonth: null,
    selectedDate: null,
    booked: false,
};

/* ═══════════════════════════════════════════════════════════
   Утилиты
   ═══════════════════════════════════════════════════════════ */
const MONTHS = ["января","февраля","марта","апреля","мая","июня",
                "июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_NOM = ["Январь","Февраль","Март","Апрель","Май","Июнь",
                    "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WEEKDAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

function pad2(n) { return String(n).padStart(2, "0"); }
function fmtDate(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function fmtDateTime(d) {
    return `${fmtDate(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function todayMidnight() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

/* ═══════════════════════════════════════════════════════════
   Сеть
   ═══════════════════════════════════════════════════════════ */
async function apiGet(path) {
    const r = await fetch(API_BASE + path, {
        headers: { "ngrok-skip-browser-warning": "1" },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
}

async function apiPost(path, body) {
    const r = await fetch(API_BASE + path, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "1",
        },
        body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    return { status: r.status, data };
}

/* ═══════════════════════════════════════════════════════════
   UI: статус-бар
   ═══════════════════════════════════════════════════════════ */
let statusTimer = null;
function showStatus(text, isError = false, ms = 3500) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = "status show" + (isError ? " error" : "");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove("show"), ms);
}

/* ═══════════════════════════════════════════════════════════
   Генерация слотов на клиенте
   ═══════════════════════════════════════════════════════════ */
function generateSlotsForDay(dayStr) {
    const cfg = state.config;
    if (!cfg || !cfg.services || cfg.services.length === 0) return [];

    const dur = cfg.services[0].duration_min;
    const [h1, m1] = cfg.work_start.split(":").map(Number);
    const [h2, m2] = cfg.work_end.split(":").map(Number);
    const [Y, M, D] = dayStr.split("-").map(Number);

    const start = new Date(Y, M - 1, D, h1, m1);
    const end   = new Date(Y, M - 1, D, h2, m2);

    const slots = [];
    const step = dur * 60 * 1000;
    for (let t = start.getTime(); t + step <= end.getTime(); t += step) {
        slots.push(new Date(t));
    }
    return slots;
}

function isSlotOccupied(slotDate) {
    return state.config.occupied.includes(fmtDateTime(slotDate));
}

function isSlotInPast(slotDate) {
    return slotDate.getTime() <= Date.now();
}

/* ═══════════════════════════════════════════════════════════
   Рендер
   ═══════════════════════════════════════════════════════════ */
function render() {
    if (!state.config) {
        document.getElementById("app").innerHTML =
            '<div class="loader">Загрузка…</div>';
        return;
    }
    const cfg = state.config;
    const app = document.getElementById("app");

    let html = `
        <div class="top-bar">
            <button class="btn-my" id="btnMy">📋 Мои записи</button>
        </div>
    `;

    html += `
        <h2>Интенсив · ${cfg.services[0]?.duration_min || 120} мин</h2>
        <div class="subtitle">Рабочие часы: ${cfg.work_start}–${cfg.work_end}</div>
    `;

    html += renderCalendar();

    if (state.selectedDate) {
        html += renderSlots();
    } else {
        html += `<div class="card empty">Выберите день в календаре 👆</div>`;
    }

    app.innerHTML = html;

    document.querySelectorAll(".cal-cell.available").forEach(el => {
        el.addEventListener("click", () => {
            state.selectedDate = el.dataset.date;
            render();
        });
    });
    document.querySelectorAll(".nav-btn").forEach(el => {
        el.addEventListener("click", () => {
            const dir = parseInt(el.dataset.dir, 10);
            state.viewMonth = new Date(
                state.viewMonth.getFullYear(),
                state.viewMonth.getMonth() + dir,
                1
            );
            render();
        });
    });
    document.querySelectorAll(".slot-btn").forEach(el => {
        el.addEventListener("click", () => onSlotClick(el));
    });

    const btnMy = document.getElementById("btnMy");
    if (btnMy) btnMy.addEventListener("click", openMyBookings);
}

function renderCalendar() {
    const cfg = state.config;
    const view = state.viewMonth;
    const year = view.getFullYear();
    const month = view.getMonth();

    const today = todayMidnight();
    const maxDate = new Date(today);
    maxDate.setDate(maxDate.getDate() + cfg.days_ahead);

    const daysOff = new Set(cfg.days_off);

    const prevDisabled = (year === today.getFullYear() && month === today.getMonth());
    const nextMonthStart = new Date(year, month + 1, 1);
    const nextDisabled = nextMonthStart > maxDate;

    let html = `
        <div class="card">
            <div class="cal-header">
                <button class="nav-btn" data-dir="-1" ${prevDisabled ? "disabled" : ""}>‹</button>
                <div class="month">${MONTHS_NOM[month]} ${year}</div>
                <button class="nav-btn" data-dir="1" ${nextDisabled ? "disabled" : ""}>›</button>
            </div>
            <div class="cal-grid">
    `;

    WEEKDAYS.forEach(w => {
        html += `<div class="cal-cell head">${w}</div>`;
    });

    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
    for (let i = 0; i < firstDow; i++) {
        html += `<div class="cal-cell empty"></div>`;
    }

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
        const cur = new Date(year, month, d);
        const curStr = fmtDate(cur);

        const inPast = cur < today;
        const tooFar = cur > maxDate;
        const closed = daysOff.has(curStr);
        const isToday = cur.getTime() === today.getTime();
        const isSelected = state.selectedDate === curStr;

        const available = !inPast && !tooFar && !closed;

        const classes = ["cal-cell"];
        if (available) classes.push("available");
        else classes.push("disabled");
        if (isToday) classes.push("today");
        if (isSelected) classes.push("selected");

        const attrs = available ? `data-date="${curStr}"` : "";
        html += `<button class="${classes.join(" ")}" ${attrs}>${d}</button>`;
    }

    html += `</div></div>`;
    return html;
}

function renderSlots() {
    const dayStr = state.selectedDate;
    const slots = generateSlotsForDay(dayStr);

    if (slots.length === 0) {
        return `<div class="card empty">В этот день нет слотов.</div>`;
    }

    const [Y, M, D] = dayStr.split("-").map(Number);
    const label = `${D} ${MONTHS[M - 1]}`;

    let html = `<div class="card">
        <div class="slots-title">Свободное время · ${label}</div>
        <div class="slots-grid">`;

    slots.forEach(slot => {
        const occupied = isSlotOccupied(slot);
        const past = isSlotInPast(slot);
        const disabled = occupied || past || state.booked;

        const hh = pad2(slot.getHours());
        const mm = pad2(slot.getMinutes());

        html += `<button class="slot-btn" data-dt="${fmtDateTime(slot)}" ${disabled ? "disabled" : ""}>
            ${hh}:${mm}
        </button>`;
    });

    html += `</div></div>`;
    return html;
}

/* ═══════════════════════════════════════════════════════════
   Действия
   ═══════════════════════════════════════════════════════════ */
async function onSlotClick(el) {
    if (state.booked) return;

    const dtStr = el.dataset.dt;
    if (!dtStr) return;

    el.disabled = true;
    const originalText = el.textContent;
    el.textContent = "…";

    try {
        const { status, data } = await apiPost("/api/book", {
            user_id: state.userId,
            service_id: state.config.services[0].id,
            datetime: dtStr,
        });

        if (status === 200 && data.ok) {
            state.booked = true;
            showStatus(`✅ Запись на ${data.pretty} подтверждена`, false, 5000);
            setTimeout(() => { if (tg) tg.close(); }, 1200);
        } else {
            el.disabled = false;
            el.textContent = originalText;
            showStatus(`❌ ${data.error || "Не удалось записаться"}`, true, 4000);
            await reloadConfig();
            render();
        }
    } catch (e) {
        el.disabled = false;
        el.textContent = originalText;
        showStatus("❌ Ошибка сети", true, 4000);
        console.error(e);
    }
}

async function reloadConfig() {
    try {
        state.config = await apiGet("/api/availability");
    } catch (e) {
        console.error("reloadConfig", e);
    }
}

/* ═══════════════════════════════════════════════════════════
   Модалка "Мои записи"
   ═══════════════════════════════════════════════════════════ */
async function openMyBookings() {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop">
            <div class="modal" id="modalContent">
                <div class="loader" style="min-height: 100px;">
                    <div class="spinner"></div>Загрузка…
                </div>
            </div>
        </div>
    `;
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
        if (e.target.id === "modalBackdrop") closeModal();
    });

    try {
        const data = await apiGet(`/api/my?user_id=${state.userId}`);
        if (!data.ok) throw new Error("bad response");
        renderMyBookings(data.bookings);
    } catch (e) {
        console.error(e);
        document.getElementById("modalContent").innerHTML =
            '<h3>📋 Мои записи</h3>' +
            '<div class="modal-empty">Не удалось загрузить. Попробуйте позже.</div>' +
            '<button class="modal-close" onclick="closeModal()">Закрыть</button>';
    }
}

function renderMyBookings(bookings) {
    const content = document.getElementById("modalContent");

    if (!bookings.length) {
        content.innerHTML =
            '<h3>📋 Мои записи</h3>' +
            '<div class="modal-empty">У вас пока нет записей.</div>' +
            '<button class="modal-close" onclick="closeModal()">Закрыть</button>';
        return;
    }

    let html = '<h3>📋 Мои записи</h3>';
    bookings.forEach(b => {
        html += `
            <div class="modal-item" data-booking-id="${b.id}">
                <div class="info">
                    <div class="when">${b.pretty}</div>
                    <div class="svc">${b.service_name} · ${b.duration_min} мин</div>
                </div>
                <button class="cancel-btn" data-cancel="${b.id}">Отменить</button>
            </div>
        `;
    });
    html += '<button class="modal-close" onclick="closeModal()">Закрыть</button>';
    content.innerHTML = html;

    content.querySelectorAll("[data-cancel]").forEach(btn => {
        btn.addEventListener("click", () => onCancelClick(btn));
    });
}

async function onCancelClick(btn) {
    const bookingId = parseInt(btn.dataset.cancel, 10);
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "…";

    try {
        const { status, data } = await apiPost("/api/cancel", {
            user_id: state.userId,
            booking_id: bookingId,
        });

        if (status === 200 && data.ok) {
            showStatus(`✅ Запись на ${data.slot} отменена`, false, 3500);

            const row = btn.closest(".modal-item");
            if (row) row.remove();

            const remaining = document.querySelectorAll(".modal-item");
            if (!remaining.length) {
                renderMyBookings([]);
            }

            await reloadConfig();
            render();
        } else {
            btn.disabled = false;
            btn.textContent = originalText;
            showStatus(`❌ ${data.error || "Не удалось отменить"}`, true, 4000);
        }
    } catch (e) {
        btn.disabled = false;
        btn.textContent = originalText;
        showStatus("❌ Ошибка сети", true, 4000);
        console.error(e);
    }
}

function closeModal() {
    document.getElementById("modal-root").innerHTML = "";
}

/* ═══════════════════════════════════════════════════════════
   Инициализация
   ═══════════════════════════════════════════════════════════ */
async function init() {
    const params = new URLSearchParams(window.location.search);
    const u = params.get("u");
    if (!u || !/^\d+$/.test(u)) {
        document.getElementById("app").innerHTML =
            '<div class="error">Не удалось определить пользователя. Откройте календарь через кнопку в боте.</div>';
        return;
    }
    state.userId = parseInt(u, 10);

    try {
        state.config = await apiGet("/api/availability");
    } catch (e) {
        document.getElementById("app").innerHTML =
            '<div class="error">Не удалось загрузить расписание. Попробуйте позже.</div>';
        console.error(e);
        return;
    }

    const now = new Date();
    state.viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);

    render();
}

init();
</script>
</body>
</html>
