<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор времени</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 20px; text-align: center; }
        h3 { margin-bottom: 20px; color: var(--tg-theme-hint-color, #777777); }
        .slot-container { display: flex; flex-direction: column; gap: 12px; max-width: 300px; margin: 0 auto; }
        .slot-btn { background-color: var(--tg-theme-button-color, #248bca); color: var(--tg-theme-button-text-color, #ffffff); border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s ease; }
        .slot-btn:active { transform: scale(0.97); }
        .no-slots { color: var(--tg-theme-hint-color, #999999); font-style: italic; margin-top: 30px; }
    </style>
</head>
<body>

    <h3 id="title">📅 Свободные окошки для записи:</h3>

    <div class="slot-container" id="container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Карта соответствия ID и реального времени (совпадает с базой данных)
        const allSlots = {
            1: "Понедельник, 12:00",
            2: "Понедельник, 15:30",
            3: "Вторник, 10:00",
            4: "Четверг, 18:00",
            5: "Пятница, 14:20"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const idsParam = urlParams.get('ids'); // Получаем строку вида "1,2,3,5"
        const container = document.getElementById('container');

        if (idsParam) {
            // Разделяем строку в массив чисел [1, 2, 3, 5]
            const freeIds = idsParam.split(',').map(Number);

            freeIds.forEach(id => {
                if (allSlots[id]) {
                    const button = document.createElement('button');
                    button.className = 'slot-btn';
                    button.innerText = allSlots[id];
                    button.onclick = () => selectSlot(id);
                    container.appendChild(button);
                }
            });
        } else {
            document.getElementById('title').innerText = "Ой!";
            container.innerHTML = '<p class="no-slots">Свободных окошек пока нет. 🤷‍♂️</p>';
        }

        function selectSlot(id) {
            // Отправляем обратно боту числовой ID выбранного слота
            tg.sendData(JSON.stringify({ slot_id: id }));
            tg.close();
        }
    </script>
</body>
</html>
